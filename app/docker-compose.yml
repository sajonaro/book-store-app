services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initialize-schema.sql:/docker-entrypoint-initdb.d/initialize-schema.sql:ro
    networks:
      - backend_net
    # Do NOT expose port 5432 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookstore} -d ${POSTGRES_DB:-bookstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  elastic:
    image: elasticsearch:8.13.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - backend_net
    # Do NOT expose port 9200 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  kibana:
    image: kibana:8.13.0
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana:/kibana:ro
    networks:
      - backend_net
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elastic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  kibana-init:
    image: curlimages/curl:8.7.1
    restart: "no"
    volumes:
      - ./kibana:/kibana:ro
    environment:
      - KIBANA_URL=http://kibana:5601
    networks:
      - backend_net
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/kibana/init-kibana.sh"]

  ai-api:
    build:
      context: ./ai-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker-internal addresses — override .env values which point to localhost
      POSTGRES_HOST: postgres
    volumes:
      - ./ai-api/credentials:/app/credentials:ro
    networks:
      - backend_net
    # Expose for local end-to-end testing (test-samples.sh)
    ports:
      - "${AI_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker-internal addresses — override .env values which point to localhost
      POSTGRES_HOST: postgres
      ELASTIC_URL: http://elastic:9200
      AI_API_URL: http://ai-api:8000
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8081}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
    networks:
      - backend_net
      - frontend_net
    depends_on:
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    # Do NOT expose port to the host; only nginx needs it
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-5555}/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/usr/share/nginx/html
    # This service exits after copying built assets to the shared volume.
    # restart: no ensures Docker does not restart it after it exits cleanly.
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - frontend_net
    depends_on:
      frontend:
        condition: service_completed_successfully

volumes:
  postgres_data:
  elastic_data:
  frontend_dist:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
