services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-bookstore}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_net
    # Do NOT expose port 27017 to the host in production
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5555
      mongoDBURL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongo:27017/${MONGO_DB:-bookstore}?authSource=admin
      ALLOWED_ORIGINS: http://localhost:8080
    networks:
      - backend_net
      - frontend_net
    depends_on:
      mongo:
        condition: service_healthy
    # Do NOT expose port 5555 to the host; only nginx needs it
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5555/books > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
